<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>待办清单</title>
<style>body{font:16px system-ui;max-width:600px;margin:3rem auto;padding:0 1rem}input,button{font:inherit;padding:.5rem}li{margin:1rem 0}small{color:#555}</style>
<h1>待办清单</h1><p><small id="connection">正在连接…</small></p><form id="form"><input id="text" maxlength="120" placeholder="添加待办" required><button>添加</button></form><ul id="list"></ul>
<script>
const manifest={id:'deskai.todo',title:'待办清单',version:'1.0',events:['todo.added','todo.toggled'],actions:[{type:'todo.add',inputSchema:{type:'object',properties:{text:{type:'string',maxLength:120}},required:['text']}},{type:'todo.toggle',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id']}}]};
let revision=0, items=[]; const conn=document.querySelector('#connection'), list=document.querySelector('#list');
const fragment=location.hash.slice(1); history.replaceState(null,'',location.pathname); let socket;
function render(){list.replaceChildren(...items.map(item=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=item.done?'✓':'○';b.onclick=()=>localToggle(item.id);li.append(b,document.createTextNode(' '+item.text));return li}))}
function send(message){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify(message))}
function publish(eventType,payload){revision++;send({type:'state',revision,state:{items}});send({type:'event',revision,eventType,payload})}
function localToggle(id){const item=items.find(x=>x.id===id);if(!item)return;item.done=!item.done;render();publish('todo.toggled',{id})}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#text'),text=input.value.trim();if(!text)return;const item={id:crypto.randomUUID(),text,done:false};items.push(item);input.value='';render();publish('todo.added',{id:item.id})};
try{const cfg=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(fragment.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));socket=new WebSocket(cfg.websocket);socket.onopen=()=>send({type:'register',ticket:cfg.ticket,manifest});socket.onclose=()=>conn.textContent='已断开；可以继续本地操作';socket.onerror=()=>conn.textContent='连接失败';socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='registered'){conn.textContent='已连接';publish('todo.added',{initial:true})}else if(m.type==='action'){let accepted=true,reason='';if(m.expectedRevision!==revision){accepted=false;reason='状态已变化'}else if(m.actionType==='todo.add'&&m.payload.text.trim()){items.push({id:crypto.randomUUID(),text:m.payload.text.trim(),done:false})}else if(m.actionType==='todo.toggle'){const item=items.find(x=>x.id===m.payload.id);if(item)item.done=!item.done;else{accepted=false;reason='找不到待办'}}else{accepted=false;reason='无效动作'}if(accepted){revision++;render()}send({type:'receipt',actionId:m.actionId,accepted,revision,state:accepted?{items}:undefined,reason})}else if(m.type==='error'){conn.textContent='连接错误：'+m.error}}}catch{conn.textContent='独立运行（未连接）'}
</script></html>
