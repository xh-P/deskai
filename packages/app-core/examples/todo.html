<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>待办清单</title>
<style>body{font:16px system-ui;max-width:600px;margin:3rem auto;padding:0 1rem}input,button{font:inherit;padding:.5rem}li{margin:1rem 0}</style>
<h1>待办清单</h1>
<p id="connection">正在连接</p>
<form id="form"><input id="text" maxlength="120" placeholder="添加待办" required><button>添加</button></form>
<ul id="list"></ul>
<script src="./deskai-app-client.js"></script>
<script>
const items = [];
const list = document.querySelector('#list');
function apply(type, payload) {
  if (type === 'todo.add' && payload.text.trim()) {
    items.push({id: crypto.randomUUID(), text: payload.text.trim(), done: false});
  } else if (type === 'todo.toggle') {
    const item = items.find(item => item.id === payload.id);
    if (!item) return {accepted: false, reason: '找不到待办'};
    item.done = !item.done;
  } else return {accepted: false, reason: '无效动作'};
  render();
  return {accepted: true};
}
function render() {
  list.replaceChildren(...items.map(item => {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.textContent = item.done ? '✓' : '○';
    button.onclick = () => {
      if (!client.busy && apply('todo.toggle', {id: item.id}).accepted) void client.publish('todo.toggled', {id: item.id});
    };
    li.append(button, document.createTextNode(' ' + item.text));
    return li;
  }));
}
const client = DeskAIApp.connect({
  snapshot: () => ({items}),
  onAction: apply,
  onStatus: state => document.querySelector('#connection').textContent =
    ({connected: '已连接', standalone: '独立运行', disconnected: '已断开', error: '连接失败'})[state]
});
document.querySelector('#form').onsubmit = event => {
  event.preventDefault();
  const input = document.querySelector('#text');
  if (!client.busy && apply('todo.add', {text: input.value}).accepted) {
    input.value = '';
    void client.publish('todo.added', {id: items.at(-1).id});
  }
};
</script>
</html>
