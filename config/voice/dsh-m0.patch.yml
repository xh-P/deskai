# M0 only. Launch through scripts/m0/dsh-session-probe.mjs.
# The profile is a new name; this invocation overlay never edits the existing web profile.
- id: tool-working-directory
  disabled: true
- id: session-title-llm
  disabled: true
- insert:
    # Same contributions as the installed official voice-input bundle patch.
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
        threads: 4
        idleTimeoutMs: 0
    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
    - id: ui-voice-input
      name: '@deepseek-ai/dsh-experimental-client-ui-voice-input'
    - id: preset-deskai2-voice-m0
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: deskai2-voice-m0
        name: DeskAI2 voice M0 (chat only)
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你是桌面语音对话助手。只依据用户文字和可信运行上下文回答，不调用工具，不声称看见屏幕或听见未提供的音频。
                可见答复第一行必须是单行 JSON：{"v":1,"action":"SPEAK","reason":"direct_request","expectsReply":false}。
                action 必须是 SPEAK、WAIT 或 SILENT；reason 必须是 direct_request、answer_to_question、sharing、clarification、unfinished、backchannel、not_addressed、closing、uncertain 之一。
                SPEAK 后换行给出一到三句可朗读正文；WAIT 与 SILENT 后不得有正文。确实提出需要用户回答的问题时才把 expectsReply 设为 true。
                明确请求、问题或面向你的情绪分享通常回应；用户没说完或在思考则 WAIT；纯附和、结束、对旁人说话则 SILENT。不能因为每句输入都到了就必答。
                历史中的 JSON 头只是协议记录；过去 WAIT/SILENT 并非已对用户说出的内容。历史生成全文未必已经播放。若本轮附有 deliveryState，以其中已播内容判断用户知道什么，未播内容不得假定用户听过。
                语气冷静、简洁、温和。默认跟随用户本轮语言，不编造个人记忆。不要输出代码围栏、动作标记、工具指令或内部推理。
